<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1737px;
    height: 1517px;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
  }
  .grid-container {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 30px;
  }
  .tech-card {
    border-radius: 24px;
    border: 3.5px solid;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  }
  .card-1 { border-color: #0284c7; background: #f0f9ff; }
  .card-1 h2 { color: #0284c7; }

  .card-2 { border-color: #2563eb; background: #eff6ff; }
  .card-2 h2 { color: #2563eb; }

  .card-3 { border-color: #d97706; background: #fefce8; }
  .card-3 h2 { color: #d97706; }

  .card-4 { border-color: #0d9488; background: #f0fdfa; }
  .card-4 h2 { color: #0d9488; }

  .card-5 { border-color: #9333ea; background: #faf5ff; }
  .card-5 h2 { color: #9333ea; }

  .card-6 { border-color: #16a34a; background: #f0fdf4; }
  .card-6 h2 { color: #16a34a; }

  .card-7 { border-color: #0284c7; background: #f0f9ff; }
  .card-7 h2 { color: #0284c7; }

  .card-8 { border-color: #dc2626; background: #fef2f2; }
  .card-8 h2 { color: #dc2626; }

  .tech-card h2 {
    font-size: 44px;
    font-weight: 800;
    margin-bottom: 12px;
  }
  .tech-card p {
    font-size: 28px;
    font-weight: 600;
    color: #475569;
  }
</style>
</head>
<body>
  <div class="grid-container">
    <div class="tech-card card-1">
      <h2>React 19</h2>
      <p>Vite &amp; Tailwind UI</p>
    </div>
    <div class="tech-card card-2">
      <h2>TypeScript</h2>
      <p>Type-safe Dashboard</p>
    </div>
    <div class="tech-card card-3">
      <h2>Prime Agent</h2>
      <p>Agency Swarm Core</p>
    </div>
    <div class="tech-card card-4">
      <h2>FastAPI</h2>
      <p>Python 3.12 REST API</p>
    </div>
    <div class="tech-card card-5">
      <h2>NetworkX</h2>
      <p>MultiDiGraph Analytics</p>
    </div>
    <div class="tech-card card-6">
      <h2>Leaflet.js</h2>
      <p>Geo-Intel &amp; CDR Towers</p>
    </div>
    <div class="tech-card card-7">
      <h2>SQLite WAL</h2>
      <p>Blockchain Ledger</p>
    </div>
    <div class="tech-card card-8">
      <h2>ReportLab</h2>
      <p>Sec 63 BSA PDF Dossier</p>
    </div>
  </div>
</body>
</html>
